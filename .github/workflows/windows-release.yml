name: Windows build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare portable package
        shell: pwsh
        run: |
          $package = "dist/new-notepad"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "build/omawrite.exe" $package
          windeployqt --release --compiler-runtime --no-translations --qmldir src "$package/omawrite.exe"
          Copy-Item "README.md", "LICENSE" $package
          Compress-Archive -Path "$package/*" -DestinationPath "dist/new-notepad-windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-notepad-windows-x64
          path: dist/new-notepad-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/new-notepad-windows-x64.zip
